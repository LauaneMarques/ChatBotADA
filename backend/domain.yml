version: "3.1"

intents:
  # Conversação
  - saudacao
  - despedida
  - pedir_ajuda

  # Emoções
  - emocao_frustracao
  - emocao_confusao
  - emocao_ansiedade
  - emocao_motivacao
  - emocao_prazer
  - emocao_desafio
  - emocao_tedio

  # Conteúdos
  - duvida_variavel
  - duvida_condicional
  - duvida_repeticao
  - duvida_funcao

  # Exercícios
  - pedir_exercicio

responses:
  utter_saudacao:
    - text: "Olá! Eu sou a ADA 👋\nEstou aqui para acompanhar você no aprendizado de programação. Como posso te ajudar hoje?"

  utter_despedida:
    - text: "Até logo! Continue praticando — a consistência é a chave da programação. 💪"

  utter_ajuda:
    - text: "Claro! Me conte qual é a sua dúvida ou qual conceito você gostaria de revisar agora."

  utter_frustracao:
    - text: "Entendo a sua frustração. Vamos com calma e resolver isso juntos, um passo por vez."

  utter_confusao:
    - text: "Não se preocupe com a confusão. Vamos organizar as ideias e simplificar isso para você."

  utter_motivacao:
    - text: "Que excelente disposição! Manter a motivação alta vai te levar muito longe na programação."

slots:
  emocao:
    type: text
    influence_conversation: true
    mappings:
      - type: custom

  assunto:
    type: text
    influence_conversation: true
    mappings:
      - type: custom

  desempenho:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

actions:
  # Emoções
  - action_salvar_frustracao
  - action_salvar_confusao
  - action_salvar_ansiedade
  - action_salvar_motivacao
  - action_salvar_prazer
  - action_salvar_desafio
  - action_salvar_tedio

  # Explicações
  - action_explicar_variavel
  - action_explicar_condicional
  - action_explicar_repeticao
  - action_explicar_funcao

  # Exercícios
  - action_exercicio

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true